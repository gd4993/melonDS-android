# Gesture fork build: runs on every push without upstream's signing secrets.
# The APK is attached to the workflow run and to the rolling "gesture-latest" pre-release.

name: melonDS Gesture Build

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build melonDS Gesture
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2 ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          chmod +x ./gradlew
          ./gradlew :app:assemblePlayStoreProdRelease --stacktrace
          cp app/build/outputs/apk/playStoreProd/release/*.apk melonDS-gesture.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-gesture
          path: melonDS-gesture.apk

      - name: Move gesture-latest tag
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/gesture')
        run: |
          git tag -f gesture-latest
          git push -f origin refs/tags/gesture-latest

      - name: Update rolling pre-release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/gesture')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          removeArtifacts: true
          tag: gesture-latest
          name: 'melonDS Gesture (latest build)'
          body: 'Latest build from ${{ github.ref_name }} @ ${{ github.sha }}. Sideload melonDS-gesture.apk; it installs alongside upstream melonDS.'
          artifacts: melonDS-gesture.apk
          artifactContentType: application/vnd.android.package-archive
